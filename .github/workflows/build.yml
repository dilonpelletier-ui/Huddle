name: Build apps
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Huddle-Windows
          path: dist/*.exe
  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:mac
      - name: Sign (ad-hoc) and zip
        run: |
          for app in $(find dist -maxdepth 2 -name Huddle.app); do
            codesign --force --deep --sign - "$app"
            n=$(basename "$(dirname "$app")")
            ditto -c -k --keepParent "$app" "dist/Huddle-$n.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Huddle-Mac
          path: dist/*.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p build-android/www
          cp index.html build-android/www/
          cd build-android
          echo '{"name":"huddle-android","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.huddle.app","appName":"Huddle","webDir":"www"}' > capacitor.config.json
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap add android
      - name: Add permissions
        working-directory: build-android
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % n
                          for n in ('RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS', 'POST_NOTIFICATIONS', 'VIBRATE'))
          s = s.replace('<application', perms + '    <application', 1)
          open(p, 'w').write(s)
          assert 'RECORD_AUDIO' in s
          EOF
      - name: Sync
        working-directory: build-android
        run: npx cap sync android
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build APK
        working-directory: build-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Huddle-Android
          path: build-android/android/app/build/outputs/apk/debug/app-debug.apk
  chromebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Huddle-Chromebook
          path: dist/*.deb
