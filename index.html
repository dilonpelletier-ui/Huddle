<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Huddle</title>

<style>

.link{background:none;color:var(--bl);font-size:14px}.av{width:32px;height:32px;border-radius:50%;background:#d1d1d6;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}

.b.tl.me::before{content:"";position:absolute;right:-8px;bottom:0;width:20px;height:19px;background:var(--bl);border-bottom-left-radius:16px 14px}
.b.tl.me::after{content:"";position:absolute;right:-26px;bottom:0;width:26px;height:19px;background:#fff;border-bottom-left-radius:10px}

.box{width:min(340px,92vw)}

#call{padding-top:calc(5vh + env(safe-area-inset-top))}#ban{padding:10px 12px;gap:10px;width:calc(100vw - 16px)}#ban button{padding:0 12px;font-size:13px;height:36px}#ban .ph{width:36px;height:36px}#ban b{font-size:16px}}
</style></head><body>
<header><div class="logo"><svg width="26" height="26" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#007aff"/><path d="M8.2 8.1c.9 1.8 2 2.9 3.8 3.8l1-1c.2-.2.5-.2.7-.1.6.2 1.2.3 1.8.3.3 0 .5.2.5.5v1.7c0 .3-.2.5-.5.5-4 0-7.3-3.3-7.3-7.3 0-.3.2-.5.5-.5h1.7c.3 0 .5.2.5.5 0 .6.1 1.2.3 1.8.1.2 0 .5-.1.7z" fill="#fff" transform="translate(-.5 .5)"/></svg>Huddle</div>

<div class="modal" id="mAdd"><div class="box"><h3>New contact</h3><input id="aN" placeholder="Name"><input id="aP" placeholder="Number, e.g. +1 555 123 4567"><div class="r"><button class="btn o" onclick="hide('mAdd')">Cancel</button><button class="btn" onclick="addC()">Save</button></div></div></div>

<script>
const $=s=>document.querySelector(s),S={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};

  onOpen:f=>LN.addListener('localNotificationActionPerformed',e=>{const k=e.notification.extra&&e.notification.extra.k;if(k)f(k)})}}

const P={chat:'M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z',send:'M12 4l-7 7h4v9h6v-9h4z',phone:'M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z',

grid:'M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z'};

$('#iC').innerHTML=ic('M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z');

let me=S.get('me',null);if(!me||!valid(digits(me))){const r=n=>String(Math.floor(Math.random()*10**n)).padStart(n,'0');me='+1 (555) '+r(3)+'-'+r(4);S.set('me',me)}

const sendProf=to=>{const p=S.get('pic',''),n=S.get('nm','');return(p||n)?post(to,{t:'prof',from:digits(me),nm:n,pic:p}):0};
function gotProf(m){const ok=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(m.pic||'')&&m.pic.length<4000;profs[kk(m.from)]={nm:String(m.nm||'').slice(0,24),pic:ok?m.pic:''};S.set('profs',profs);if(inCall&&kk(peerNum)===kk(m.from)){$('#cn').textContent=label(peerNum);paint($('#ca'),peerNum)}if($('#ban').classList.contains('show')&&kk(ringFrom)===kk(m.from)){$('#bn').textContent=label(m.from);paint($('#bav'),m.from)}}
/* signaling: free public ntfy.sh relay, no account needed. Audio itself goes directly between devices */
const R='https://ntfy.sh/';let code=S.get('code',''),es,cid,pc,ringOffer;
async function topic(n){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('huddle|'+code+'|'+digits(n).slice(-10)));return 'hd'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40)}
async function post(to,o){try{await fetch(R+await topic(to),{method:'POST',body:JSON.stringify(o)});return true}catch{return false}}
async function pack(d){const s=new Blob([JSON.stringify(d)]).stream().pipeThrough(new CompressionStream('deflate'));const b=new Uint8Array(await new Response(s).arrayBuffer());let t='';b.forEach(c=>t+=String.fromCharCode(c));return btoa(t)}
async function unpack(t){const b=Uint8Array.from(atob(t),c=>c.charCodeAt(0));const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'));return JSON.parse(await new Response(s).text())}
async function conn(){if(es)es.close();clearTimeout(rcT);if(!code)return;const since=S.get('seen',Math.floor(Date.now()/1000)-5);es=new EventSource(R+await topic(me)+'/sse?since='+since);
 es.onopen=()=>{$('#myn').textContent=me;$('#dot').classList.add('ok');for(const k in msgs)msgs[k].filter(x=>x.me&&(x.st==='failed'||x.st==='sending')).forEach(x=>trySend(k,x))};
 es.onerror=()=>{$('#myn').textContent=me+'  ·  Offline';$('#dot').classList.remove('ok');es.close();rcT=setTimeout(conn,3000)};
 es.onmessage=async e=>{let m,j;try{j=JSON.parse(e.data);if(j.event!=='message')return;m=JSON.parse(j.message)}catch{return}
  if(j.time)S.set('seen',j.time);
  if(m.t==='prof')return gotProf(m);if(m.t==='msg')return gotMsg(m);if(m.t==='rcpt')return gotRcpt(m);
  if(m.t==='call'){if(Date.now()/1000-j.time>60)return;if(inCall||m.id===cid)return inCall?post(m.from,{t:'decline',id:m.id}):0;ringFrom=m.from;cid=m.id;ringOffer=m.sdp;ringRb=!!m.rb;ringIn(m.from)}
  else if(m.id!==cid)return;
  else if(m.t==='answer'&&pc&&!pc.currentRemoteDescription){clearTimeout(ringTO);ringback(false);$('#cs').textContent='Connecting…';await pc.setRemoteDescription(await unpack(m.sdp))}
  else if(m.t==='decline')end('Declined');
  else if(m.t==='end'){if($('#ban').classList.contains('show'))stopRing();else end('Call ended')}}}

/* ringing */
function ringIn(d){$('#ban').classList.toggle('rbw',ringRb);$('#bn').textContent=label(d);$('#bs').textContent='Incoming Huddle call'+(nameOf(d)?'  ·  '+fmt(d):'');$('#bav').style.background=col(label(d));paint($('#bav'),d);$('#ban').classList.add('show');
 if(window.hd)hd.notify(label(d),'Incoming Huddle call. Open Huddle to accept.',true,'');else try{notif=new Notification(label(d),{body:'Incoming Huddle call',requireInteraction:true,silent:true});notif.onclick=()=>{window.focus()}}catch{}
 try{actx=actx||new AudioContext();const beep=()=>{[0,.35].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=480;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.25)})};beep();tone=setInterval(beep,2200)}catch{}}
function stopRing(){$('#ban').classList.remove('show');clearInterval(tone);try{notif&&notif.close()}catch{}}
function decline(){stopRing();post(ringFrom,{t:'decline',id:cid})}
async function accept(){stopRing();if(!await mic())return;open(ringFrom,'Connecting…');setRb(ringRb);sendProf(ringFrom);pc=mk();await pc.setRemoteDescription(await unpack(ringOffer));const a=await pc.createAnswer();await pc.setLocalDescription(a);await ice(pc);post(ringFrom,{t:'answer',id:cid,sdp:await pack(pc.localDescription)})}

/* calls */
async function mic(){if(inCall)return false;try{local=await navigator.mediaDevices.getUserMedia({audio:true});return true}catch{alert('Huddle needs microphone access to make calls.');return false}}
function open(d,status){inCall=true;peerNum=d;held=muted=false;$('#oM').classList.remove('on');$('#oH').classList.remove('on');
 $('#cn').textContent=label(d);paint($('#ca'),d);$('#cs').textContent=status;show('call')}
function mk(){const p=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});local.getTracks().forEach(t=>p.addTrack(t,local));
 p.ontrack=e=>{let a=$('#ra');if(!a){a=document.createElement('audio');a.id='ra';a.autoplay=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play().catch(()=>{})};
 p.onconnectionstatechange=()=>{const s=p.connectionState;if(s==='connected')startTimer();else if(s==='failed')end('Connection failed');else if(s==='disconnected')setTimeout(()=>{if(pc===p&&p.connectionState==='disconnected')end('Call ended')},4000)};return p}
const ice=p=>new Promise(r=>{if(p.iceGatheringState==='complete')return r();const f=()=>{if(p.iceGatheringState==='complete'){p.removeEventListener('icegatheringstatechange',f);r()}};p.addEventListener('icegatheringstatechange',f);setTimeout(r,3500)});
async function dial(num){const d=digits(num);if(!d)return;if(!valid(d))return alert('Enter a full 10-digit phone number.');if(!code)return settings();if(!await mic())return;open(d,'Calling…');setRb(rbOn);ringback(true);ringTO=setTimeout(()=>end('No answer'),45000);
 cid=crypto.randomUUID();pc=mk();await pc.setLocalDescription(await pc.createOffer());await ice(pc);if(!inCall)return;await sendProf(d);
 if(!await post(d,{t:'call',id:cid,rb:rbOn,from:digits(me),sdp:await pack(pc.localDescription)}))end("Can't reach the network")}
function startTimer(){ringback(false);clearTimeout(ringTO);if(timer)return;const t0=Date.now();const f=()=>{if(held)return;const s=Math.floor((Date.now()-t0)/1000);$('#cs').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};f();timer=setInterval(f,1000)}
function end(msg){if(!inCall)return;ringback(false);clearTimeout(ringTO);$('#cs').textContent=msg;clearInterval(timer);timer=null;setTimeout(hang,1100)}
function hang(){if(!inCall)return;ringback(false);clearTimeout(ringTO);post(peerNum,{t:'end',id:cid});pc&&pc.close();pc=null;const a=$('#ra');a&&a.remove();local&&local.getTracks().forEach(t=>t.stop());clearInterval(timer);timer=null;inCall=false;setRb(false);hide('call')}

/* in-call options */
function mute(){muted=!muted;local.getTracks().forEach(t=>t.enabled=!muted);$('#oM').classList.toggle('on',muted)}
function hold(){held=!held;local.getTracks().forEach(t=>t.enabled=!held&&!muted);document.querySelectorAll('audio').forEach(a=>a.muted=held);$('#oH').classList.toggle('on',held);if(held)$('#cs').textContent='On hold'}

/* screens */
const sync=()=>{$('#tC').classList.toggle('on',cur==='c');$('#tK').classList.toggle('on',cur==='k');$('#tM').classList.toggle('on',cur==='m')};
function tab(t){cur=t;q='';chat=null;sync();render()}
function addC(){const n=$('#aN').value.trim(),p=$('#aP').value.trim();if(!n)return;if(!valid(digits(p)))return alert('Enter a normal 10-digit phone number.');contacts=contacts.filter(c=>digits(c.num)!==digits(p));contacts.push({name:n,num:p});S.set('contacts',contacts);hide('mAdd');$('#aN').value=$('#aP').value='';if(inCall){$('#cn').textContent=n;$('#ca').textContent=n[0].toUpperCase()}render()}
function rm(i){contacts.splice(i,1);S.set('contacts',contacts);render()}
function paintMe(){const p=S.get('pic',''),n=S.get('nm','');for(const e of [$('#myav'),$('#spv')]){if(!e)continue;e.style.background=p?`url(${p}) center/cover`:'#d1d1d6';e.textContent=p?'':(n[0]||'Me').toUpperCase()}}
function settings(){$('#sM').value=me;$('#sU').value=code;$('#sR').checked=rbOn;const at=S.get('nmAt',0),open=at+6048e5,lock=at>0&&open>Date.now();$('#sN').value=S.get('nm','');$('#sN').disabled=lock;$('#sNh').textContent=lock?'You can change your caller ID again on '+new Date(open).toLocaleDateString():'You can change this once every 7 days.';paintMe();show('mSet')}
function rmPic(){S.set('pic','');paintMe()}
function saveS(){const c=$('#sU').value.trim(),n=$('#sM').value.trim(),nn=$('#sN').value.trim();let d=digits(n);if(d.length===11&&d[0]==='1')d=d.slice(1);if(!c||d.length!==10)return alert('Enter a group code and a normal 10-digit phone number, like (555) 123-4567.');const at=S.get('nmAt',0);if(nn&&nn!==S.get('nm','')&&!(at>0&&at+6048e5>Date.now())){S.set('nm',nn);S.set('nmAt',Date.now())}me='+1 '+fmt(d);S.set('me',me);code=c;S.set('code',c);rbOn=$('#sR').checked;S.set('rb',rbOn);$('#myn').textContent=me;paintMe();hide('mSet');conn()}
function pk(k){tones(DT[k],120);pad+=k;$('#disp').textContent=fmt(pad)}
function pdel(){pad=pad.slice(0,-1);$('#disp').textContent=fmt(pad)}
const ORD={sending:0,sent:1,delivered:2,read:3,failed:-1};
const saveM=()=>{for(const k in msgs)if(msgs[k].length>400)msgs[k]=msgs[k].slice(-400);S.set('msgs',msgs);S.set('unread',unread)};
function badge(){const n=Object.values(unread).reduce((a,b)=>a+b,0),b=$('#bd');b.style.display=n?'block':'none';b.textContent=n;window.hd&&hd.badge(n)}
const chime=r=>{if(r){tones([660],110,.05);setTimeout(()=>tones([880],160,.05),120)}else tones([520],70,.04)};
const tm=t=>{const d=new Date(t);return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};
const sendRcpt=(k,ids,s)=>post(k,{t:'rcpt',from:digits(me),ids,s});
function readAll(k){if(!document.hasFocus())return;const L=msgs[k]||[],ids=L.filter(x=>!x.me&&!x.rd).map(x=>x.id);L.forEach(x=>x.rd=true);unread[k]=0;saveM();badge();if(ids.length)sendRcpt(k,ids,'r')}
function openChat(k){cur='m';chat=k;q='';draft='';sync();readAll(k);render()}
function gotMsg(m){const k=kk(m.from),L=msgs[k]=msgs[k]||[];if(L.some(x=>x.id===m.id))return;
 if(m.nm){profs[k]={nm:String(m.nm).slice(0,24),pic:(profs[k]||{}).pic||''};S.set('profs',profs)}
 const text=String(m.x||'').slice(0,1000),viewing=document.hasFocus()&&cur==='m'&&chat===k;
 L.push({id:m.id,me:false,text,ts:m.ts||Date.now(),rd:viewing});fresh[m.id]=1;
 if(viewing)sendRcpt(k,[m.id],'r');else{unread[k]=(unread[k]||0)+1;sendRcpt(k,[m.id],'d');if(!document.hasFocus()){const n=nameOf(k)||pOf(k).nm||fmt(k);if(window.hd)hd.notify(n,text.slice(0,140),false,k);else try{new Notification(n,{body:text})}catch{}}}
 if(document.hasFocus())chime(true);saveM();badge();if(cur==='m')render()}
function gotRcpt(m){const k=kk(m.from),s=m.s==='r'?'read':'delivered';if(!msgs[k])return;(m.ids||[]).forEach(id=>{const x=msgs[k].find(y=>y.id===id);if(x&&x.me&&(x.st==='failed'||ORD[x.st]<ORD[s]))x.st=s});saveM();if(cur==='m')render()}
async function trySend(k,m){const ok=await post(k,{t:'msg',id:m.id,from:digits(me),nm:S.get('nm',''),x:m.text,ts:m.ts});if(m.st==='sending'||m.st==='failed')m.st=ok?'sent':'failed';saveM();if(cur==='m')render()}
async function sendTo(k,x){const L=msgs[k]=msgs[k]||[],m={id:crypto.randomUUID(),me:true,text:x,ts:Date.now(),st:'sending'};L.push(m);fresh[m.id]=1;saveM();render();chime(false);if(!S.get('pf'+k,0)){S.set('pf'+k,1);sendProf(k)}await trySend(k,m)}
function retry(id){const k=chat,m=(msgs[k]||[]).find(x=>x.id===id);if(m){m.st='sending';render();trySend(k,m)}}
function doSend(){const t=$('#mi'),x=t.value.trim();if(!x||!chat)return;t.value='';draft='';t.style.height='auto';$('#sb').disabled=true;sendTo(chat,x)}
function bub(k){const L=msgs[k]||[];let last=-1;L.forEach((x,i)=>{if(x.me)last=i});
 return L.map((x,i)=>{const nx=L[i+1],pv=L[i-1],tail=!nx||nx.me!==x.me,gap=pv&&pv.me!==x.me;
  let s=`<div class="b ${x.me?'me':'th'}${tail?' tl':''}${gap?' gap':''}${fresh[x.id]?' new':''}">${esc(x.text)}</div>`;
  if(x.me&&x.st==='failed')s+=`<div class="st bad" onclick="retry('${x.id}')">Not Delivered. Tap to retry</div>`;
  else if(x.me&&i===last)s+=`<div class="st">${{sending:'Sending…',sent:'Sent',delivered:'Delivered',read:'Read'}[x.st]||''}</div>`;
  delete fresh[x.id];return s}).join('')}
const FINE=matchMedia('(pointer:fine)').matches;
function renderM(m){const had=document.activeElement&&document.activeElement.id==='q';
 if(chat){const k=chat,name=nameOf(k)||pOf(k).nm||fmt(k),ms=$('#ms');
  if(ms&&ms.dataset.k===k){ms.innerHTML=bub(k);ms.scrollTop=ms.scrollHeight;return}
  m.innerHTML=`<div class="chat"><div class="ch"><button class="ib2" onclick="chat=null;render()">&lsaquo; Messages</button>${avh(k,name,34)}<b>${esc(name)}</b><span class="sp"></span><button class="ib2" onclick="dial('${k}')">Call</button></div><div class="ms" id="ms" data-k="${k}">${bub(k)}</div><div class="cp"><textarea id="mi" rows="1" maxlength="800" placeholder="Message"></textarea><button id="sb" disabled onclick="doSend()">${ic(P.send,18)}</button></div></div>`;
  const t=$('#mi');t.value=draft;t.oninput=()=>{draft=t.value;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,110)+'px';$('#sb').disabled=!t.value.trim()};t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}};$('#sb').disabled=!draft.trim();if(FINE)t.focus();$('#ms').scrollTop=1e9;return}
 const keys=new Set(Object.keys(msgs).filter(k=>msgs[k].length)),ql=q.toLowerCase();
 const nmOf=k=>nameOf(k)||pOf(k).nm||fmt(k);
 let rows=[...keys].map(k=>({k,l:msgs[k][msgs[k].length-1]})).sort((a,b)=>b.l.ts-a.l.ts).filter(i=>!ql||nmOf(i.k).toLowerCase().includes(ql)||i.k.includes(digits(q)||'@@')).map(i=>{const u=unread[i.k]||0;
  return `<div class="row" onclick="openChat('${i.k}')">${avh(i.k,nmOf(i.k))}<div style="min-width:0;flex:1"><b>${esc(nmOf(i.k))}</b><small style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${u?'color:var(--tx);font-weight:500':''}">${i.l.me?'You: ':''}${esc(i.l.text)}</small></div><div style="text-align:right;font-size:12px;color:var(--mu)">${tm(i.l.ts)}${u?`<div style="margin-top:4px"><span class="ud">${u}</span></div>`:''}</div></div>`}).join('');
 if(ql)contacts.filter(c=>!keys.has(digits(c.num).slice(-10))&&(c.name+c.num).toLowerCase().includes(ql)).forEach(c=>{rows+=`<div class="row" onclick="openChat('${digits(c.num).slice(-10)}')">${avh(c.num,c.name)}<div><b>${esc(c.name)}</b><small>${fmt(c.num)}</small></div></div>`});
 if(valid(digits(q))&&!keys.has(digits(q).slice(-10)))rows+=`<div class="row" onclick="openChat('${digits(q).slice(-10)}')"><div class="ph" style="background:var(--bl)">#</div><div><b>Message ${esc(fmt(q))}</b></div></div>`;
 m.innerHTML=`<div class="card"><div class="sw">${ic(P.search,20)}<input id="q" placeholder="Search or enter a number" value="${esc(q)}" autocomplete="off"></div><div style="margin-top:8px">${rows||'<div class="empty" style="padding:50px 0 30px"><p>No messages yet. Enter a number above, or tap the message icon next to a contact.</p></div>'}</div></div>`;
 const i=$('#q');if(had||FINE){i.focus();i.setSelectionRange(q.length,q.length)}i.oninput=()=>{q=i.value;render()};i.onkeydown=e=>{if(e.key==='Enter'&&valid(digits(q)))openChat(digits(q).slice(-10))}}
function render(){const m=$('#main'),had=document.activeElement&&document.activeElement.id==='q';m.style.maxWidth='720px';if(cur==='m')return renderM(m);
 if(cur==='k'){m.innerHTML=`<div class="disp" id="disp">${fmt(pad)}</div><div class="pad">${padHTML('pk')}</div><button class="cb" onclick="dial(pad)">${ic(P.phone,32)}</button><button class="del" onclick="pdel()">Delete</button>`;return}
 const f=contacts.map((c,i)=>({...c,i})).filter(c=>(c.name+c.num).toLowerCase().includes(q.toLowerCase()));
 let rows=f.map(c=>`<div class="row" onclick="dial('${c.num}')">${avh(c.num,c.name)}<div><b>${c.name}</b><small>${fmt(c.num)}</small></div><div class="rb"><button title="Message" onclick="event.stopPropagation();openChat('${digits(c.num).slice(-10)}')">${ic(P.chat,20)}</button><button title="Remove" onclick="event.stopPropagation();rm(${c.i})">&times;</button><button class="c">${ic(P.phone,20)}</button></div></div>`).join('');
 if(valid(digits(q))&&!f.length)rows+=`<div class="row" onclick="dial('${q}')"><div class="ph" style="background:var(--bl)">#</div><div><b>Call ${q}</b></div><div class="rb"><button class="c">${ic(P.phone,20)}</button></div></div>`;
 m.innerHTML=`<div class="card"><div class="sw">${ic(P.search,20)}<input id="q" placeholder="Search contacts or dial" value="${q}" autocomplete="off"></div>${contacts.length?`<div style="margin-top:8px">${rows}</div>`:''}</div>`+
 (contacts.length?`<div class="add"><button class="btn o" onclick="show('mAdd')">Add contact</button></div>`:`<div class="empty"><svg width="240" height="120" viewBox="0 0 240 120" style="margin:0 auto"><circle cx="62" cy="62" r="32" fill="#ff6b6b"/><circle cx="178" cy="62" r="32" fill="#5ac8fa"/><circle cx="120" cy="60" r="46" fill="#ffb340"/><g transform="translate(96 36) scale(2)" fill="#fff"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" transform="scale(.9)"/></g></svg><h1>Call someone you know</h1><p>Add a contact or type a number to start a voice call.</p><button class="btn" onclick="show('mAdd')">Add contact</button></div>`);
 const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length);i.oninput=()=>{q=i.value;render()};i.onkeydown=e=>{if(e.key==='Enter'&&valid(digits(q)))dial(q)}}
$('#sF').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,64,64);let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length>3200&&q>.2){q-=.1;d=c.toDataURL('image/jpeg',q)}S.set('pic',d);paintMe()};im.src=URL.createObjectURL(f);e.target.value=''};
paintMe();badge();window.addEventListener('focus',()=>{if(cur==='m'&&chat)readAll(chat)});window.hd&&hd.onOpen(k=>openChat(k));
try{Notification.requestPermission()}catch{}
render();conn();if(!code)settings();
</script></body></html>
